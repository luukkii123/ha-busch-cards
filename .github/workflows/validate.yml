name: Validate

on:
  workflow_call:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: plugin

  node:
    name: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Syntax
        run: for f in dist/*.js; do node --check "$f"; done
      - name: Shared blocks match their hash
        run: |
          python3 - <<'PY'
          import hashlib,pathlib,re,sys
          bad=False
          for p in sorted(pathlib.Path('dist').glob('*.js')):
            text=p.read_text();names=re.findall(r'/\* BEGIN BUSCH SHARED (\w+) ',text)
            if not names: print(p,'kein Shared-Block');continue
            for n in sorted(set(names)):
              blocks=re.findall(r'/\* BEGIN BUSCH SHARED '+n+r' \S+ sha256:([0-9a-f]{64}) \*/\n(.*?)/\* END BUSCH SHARED '+n+r' \*/',text,re.S)
              ok=len(blocks)==1==names.count(n)==text.count('/* END BUSCH SHARED '+n+' */') and hashlib.sha256(blocks[0][1].encode()).hexdigest()==blocks[0][0]
              print(p,n,'ok' if ok else 'ABWEICHUNG');bad|=not ok
          sys.exit(1 if bad else 0)
          PY
      - name: Tests
        run: if ls tests/*.test.js >/dev/null 2>&1; then node --test tests/*.test.js; else echo "no tests"; fi
